<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signing out - Pryv</title>
<script id="logout-bootstrap">(()=>{let r=0,s=location.protocol=='https:'?'; Secure':'',c='thirdweb-session walletAddress pryv-session-confirmed pryv-legacy-auth worldcoin-nonce worldcoin-verified worldappWalletAddress authjs.csrf-token __Host-authjs.csrf-token authjs.callback-url __Secure-authjs.callback-url next-auth.csrf-token __Host-next-auth.csrf-token next-auth.callback-url __Secure-next-auth.callback-url'.split(' ');function g(){r||(r=1,location.replace(new URL('/login',location)))}function w(n,v,m){document.cookie=n+'='+v+'; Path=/; Max-Age='+m+'; SameSite=Lax'+s}try{w('pryv-logged-out','1',604800);for(const n of c)w(n,'',0)}catch(e){}try{for(let i=localStorage.length;i--;){let y=localStorage.key(i);y&&/thirdweb|wallet|tw_auth/i.test(y)&&localStorage.removeItem(y)}for(const y of'__tw_auth thirdweb_in_app_wallet_auth_token thirdweb_connected_wallet'.split(' '))localStorage.removeItem(y)}catch(e){}if(typeof fetch!='function')return g();let t=setTimeout(g,5000);fetch('/api/auth/thirdweb',{method:'DELETE',credentials:'include',cache:'no-store',keepalive:!0}).then(()=>{clearTimeout(t);g()},()=>setTimeout(g,300))})();</script>
<style>
:root{color-scheme:light dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#fff;color:#111827}
body{margin:0;min-height:100dvh;background:#fff;color:#111827}
main{box-sizing:border-box;min-height:100dvh;width:100%;padding:40px 20px}
section{max-width:672px;margin:0 auto;border-bottom:1px solid #e5e7eb;padding-bottom:32px}
p{margin:0;color:#6b7280;font-size:14px;line-height:1.5}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
h1{margin:12px 0 12px;font-size:30px;line-height:1.15;font-weight:650;letter-spacing:0}
@media (prefers-color-scheme:dark){:root,body{background:#020617;color:#f8fafc}section{border-color:#1f2937}p{color:#94a3b8}}
</style>
</head>
<body>
<main>
<section>
<p class="eyebrow">Session</p>
<h1>Signing you out...</h1>
<p>Clearing wallet state and server session before returning you to sign in.</p>
</section>
</main>
</body>
</html>
