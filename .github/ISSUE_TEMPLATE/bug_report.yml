name: Bug report
description: Report a reproducible problem in the web or Expo client
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets or personal data. Report vulnerabilities through SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable set of steps.
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Route or component
      placeholder: /docs, /api-keys, mobile account screen
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Browser and version, Node version, operating system
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove tokens, wallet activity, request payloads, and personal data.
